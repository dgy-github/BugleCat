# Copy this file to ~/.nanocodex/mcp.toml and edit for your machine.
# MCP servers run outside the BugleCat sandbox. Only enable servers you trust.

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "<workspace-dir>"]

# Project-local Windows computer-use server example:
# [mcp_servers.windows_computer_use]
