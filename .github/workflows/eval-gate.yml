name: eval-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden-gate:
    runs-on: windows-latest
    # Full offline evidence-chain tests took 43 minutes locally, before CI build time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build current offline regression executables
        run: cargo build --manifest-path rust/Cargo.toml --examples --locked

      - name: Offline Python and binary regression tests
        run: python -m pytest tests -q

      - name: Golden regression gate (unit tier)
        run: python -m evals.golden.runner --tier unit

      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: evals/golden/reports/

  rust-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: python scripts/check_rustfmt.py

      - name: Workspace lib tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --lib

      - name: Golden regression gate (cargo tier)
        run: python -m evals.golden.runner --tier cargo --scope-to-tiers --output evals/golden/reports/ci-cargo

      - name: Upload golden cargo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report-cargo
          path: evals/golden/reports/ci-cargo/

  desktop-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/gui/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: rust/gui

      - name: Frontend protocol tests
        run: npm run test:protocol
        working-directory: rust/gui

      - name: Frontend build, types, and protocol contract
        run: npm run build
        working-directory: rust/gui

      - name: Desktop backend tests
        run: cargo test --manifest-path rust/gui/src-tauri/Cargo.toml --lib --locked

  # The agent tier needs a configured model route and stays manual
  # (see evals/golden/README.md); it is not a CI gate here.
