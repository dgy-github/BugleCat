name: eval-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e .

      - name: Offline unit tests
        run: python -m pytest tests -q

      - name: Golden regression gate (unit tier)
        run: python -m evals.golden.runner --tier unit

      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: evals/golden/reports/

  rust-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Workspace lib tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --lib

      - name: Golden regression gate (cargo tier)
        run: python -m evals.golden.runner --tier cargo --scope-to-tiers --output evals/golden/reports/ci-cargo

      - name: Upload golden cargo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report-cargo
          path: evals/golden/reports/ci-cargo/

  # The agent tier needs a configured model route and stays manual
  # (see evals/golden/README.md); it is not a CI gate here.
