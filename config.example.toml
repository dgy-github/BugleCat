# Copy this file to ~/.nanocodex/config.toml and fill in your own values.
# Do not commit the real config file or any real API key.

# DeepSeek hosted API:
api_key = "sk-your-real-key"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"

# Local OpenAI-compatible model example:
# api_key = "local-dev-key"
# base_url = "http://127.0.0.1:8005/v1"
# model = "Qwen3.6-27B-Q4_K_M"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
reasoning_effort = "auto"

# Optional:
# context_token_budget = 512000
# context_window = 1048576
# max_iterations = 60
# max_tool_calls = 120
# context_edit_enabled = true
# context_edit_max_chars = 120000
# context_edit_keep_recent_messages = 30
# context_edit_max_tool_result_chars = 4000
# available_models = ["deepseek-chat", "deepseek-reasoner", "deepseek-v4-pro"]
# 费用均按每百万 Token 计算；币种必须是 CNY（人民币）或 USD（美元）。
# price_in = 0.27
# price_out = 1.10
# price_currency = "USD"

# Deterministic hooks around tool execution and turn lifecycle. A non-zero
# pre_tool or user_prompt hook blocks the action; post_tool/stop output is
# appended for audit. Claude-style event aliases such as UserPromptSubmit and
# Stop are accepted and normalized.
# [[hooks]]
# event = "pre_tool"          # pre_tool | post_tool | user_prompt | stop
# matcher = "shell|apply_patch"
# command = "echo checking %NCX_HOOK_TOOL%"
# timeout_s = 10
