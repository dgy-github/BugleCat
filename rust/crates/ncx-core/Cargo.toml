[package]
name = "ncx-core"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ncx-sandbox = { path = "../ncx-sandbox" }
ncx-config = { path = "../ncx-config" }
ncx-provider = { path = "../ncx-provider" }
ncx-tools = { path = "../ncx-tools" }
ncx-mcp = { path = "../ncx-mcp" }
ncx-context = { path = "../ncx-context" }
ncx-protocol = { path = "../ncx-protocol" }
ncx-thread-store = { path = "../ncx-thread-store" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "process", "io-util"] }
async-trait = "0.1"
futures-util = "0.3"
regex = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros"] }
