# nanocodex — Rust rewrite (workspace).
#
# Lives alongside the Python implementation during the staged migration; the
# Python tree is untouched. Crates map 1:1 to the Python packages (see the
# migration plan): ncx-sandbox <- nanocodex/sandbox, ncx-config <- config.py,
# ncx-provider <- nanocodex/provider, ncx-tools <- nanocodex/tools,
# ncx-core <- nanocodex/agent, ncx-cli <- cli.py.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.96"

# Release profile tuned for DISTRIBUTION (the rewrite's real win, not throughput
# — the app is I/O/model-bound). strip + LTO + size-opt shrink the single binary;
# fat LTO + 1 codegen unit also trims dead code across crates.
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
